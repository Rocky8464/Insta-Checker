<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta Checker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .account {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .account span {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            cursor: pointer;
        }

        input {
            padding: 10px;
            width: 70%;
            box-sizing: border-box;
        }

        #accounts {
            margin-bottom: 25px;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        #tokenBox {
            margin-bottom: 30px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        #token {
            width: 100%;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <h1>Instagram Reel Monitor</h1>

    <!-- Token setup -->
    <div id="tokenBox">

        <h3>GitHub Connection</h3>

        <input
            type="password"
            id="token"
            placeholder="GitHub token"
        >

        <br>

        <button onclick="saveToken()">
            Save Token
        </button>

        <button onclick="clearToken()">
            Clear Token
        </button>

    </div>


    <!-- Accounts -->
    <div id="accounts">
        Loading...
    </div>


    <!-- Add account -->
    <div>

        <input
            type="text"
            id="username"
            placeholder="Instagram username"
        >

        <button onclick="addAccount()">
            Add
        </button>

    </div>

    <br>

    <button onclick="saveAccounts()">
        Save Changes
    </button>

    <div id="status"></div>


<script>

/* =========================================================
   GITHUB SETTINGS
   ========================================================= */

const GITHUB_USERNAME = "Rocky8464";

const REPOSITORY = "Insta-Checker";

const BRANCH = "main";

const FILE_PATH = "accounts.json";


/* =========================================================
   VARIABLES
   ========================================================= */

let accounts = [];

let currentFileSha = null;


/* =========================================================
   GITHUB API
   ========================================================= */

const API_URL =
    `https://api.github.com/repos/${GITHUB_USERNAME}/${REPOSITORY}/contents/${FILE_PATH}`;


/* =========================================================
   TOKEN
   ========================================================= */

function getToken() {

    return localStorage.getItem("github_token");

}


function saveToken() {

    const input =
        document.getElementById("token");

    const token =
        input.value.trim();

    if (!token) {

        alert("Enter a GitHub token.");

        return;
    }

    localStorage.setItem(
        "github_token",
        token
    );

    input.value = "";

    setStatus("Token saved in this browser.");

    loadAccounts();
}


function clearToken() {

    localStorage.removeItem(
        "github_token"
    );

    document.getElementById("token").value = "";

    setStatus("GitHub token cleared.");

}


/* =========================================================
   LOAD ACCOUNTS
   ========================================================= */

async function loadAccounts() {

    const token = getToken();

    if (!token) {

        document.getElementById("accounts").innerHTML =
            "<p>Enter your GitHub token above.</p>";

        return;
    }

    setStatus("Loading accounts...");

    try {

        const response = await fetch(
            `${API_URL}?ref=${BRANCH}`,
            {
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/vnd.github+json"
                }
            }
        );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                `GitHub error ${response.status}: ${errorText}`
            );
        }


        const data =
            await response.json();


        const decoded =
            decodeBase64Unicode(data.content);


        accounts =
            JSON.parse(decoded);


        currentFileSha =
            data.sha;


        displayAccounts();

        setStatus("Accounts loaded.");


    } catch (error) {

        console.error(error);

        setStatus(
            "❌ Failed to load accounts. Check the token."
        );
    }
}


/* =========================================================
   DISPLAY ACCOUNTS
   ========================================================= */

function displayAccounts() {

    const container =
        document.getElementById("accounts");

    container.innerHTML = "";


    if (accounts.length === 0) {

        container.innerHTML =
            "<p>No accounts added.</p>";

        return;
    }


    accounts.forEach(
        (username, index) => {

            const row =
                document.createElement("div");

            row.className =
                "account";


            const name =
                document.createElement("span");

            name.textContent =
                username;


            const removeButton =
                document.createElement("button");

            removeButton.textContent =
                "Remove";


            removeButton.onclick =
                function () {

                    removeAccount(index);

                };


            row.appendChild(name);

            row.appendChild(removeButton);

            container.appendChild(row);

        }
    );
}


/* =========================================================
   ADD ACCOUNT
   ========================================================= */

function addAccount() {

    const input =
        document.getElementById("username");

    let username =
        input.value.trim();


    if (!username) {

        alert(
            "Enter an Instagram username."
        );

        return;
    }


    /*
       Remove @ if entered
    */

    username =
        username.replace(/^@/, "");


    /*
       Prevent duplicates
    */

    if (accounts.includes(username)) {

        alert(
            "Account already exists."
        );

        return;
    }


    accounts.push(username);

    input.value = "";

    displayAccounts();

    setStatus(
        "Account added. Click Save Changes."
    );
}


/* =========================================================
   REMOVE ACCOUNT
   ========================================================= */

function removeAccount(index) {

    const username =
        accounts[index];


    if (!confirm(
        `Remove @${username}?`
    )) {

        return;
    }


    accounts.splice(index, 1);

    displayAccounts();

    setStatus(
        "Account removed. Click Save Changes."
    );
}


/* =========================================================
   SAVE ACCOUNTS TO GITHUB
   ========================================================= */

async function saveAccounts() {

    const token =
        getToken();


    if (!token) {

        alert(
            "GitHub token is missing."
        );

        return;
    }


    if (!currentFileSha) {

        alert(
            "accounts.json has not been loaded yet."
        );

        return;
    }


    setStatus(
        "Saving to GitHub..."
    );


    try {

        /*
           Convert accounts to JSON
        */

        const jsonContent =
            JSON.stringify(
                accounts,
                null,
                2
            ) + "\n";


        /*
           Encode as Base64
        */

        const encodedContent =
            encodeBase64Unicode(
                jsonContent
            );


        /*
           Update GitHub file
        */

        const response =
            await fetch(
                API_URL,
                {
                    method: "PUT",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`,

                        "Accept":
                            "application/vnd.github+json",

                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            "Update monitored Instagram accounts",

                        content:
                            encodedContent,

                        sha:
                            currentFileSha,

                        branch:
                            BRANCH

                    })
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                `GitHub error ${response.status}: ${errorText}`
            );
        }


        const data =
            await response.json();


        /*
           Store new file SHA
        */

        currentFileSha =
            data.content.sha;


        setStatus(
            "✅ Saved successfully to GitHub."
        );


    } catch (error) {

        console.error(error);

        setStatus(
            "❌ Save failed."
        );
    }
}


/* =========================================================
   BASE64 ENCODE
   ========================================================= */

function encodeBase64Unicode(text) {

    const bytes =
        new TextEncoder().encode(text);

    let binary = "";

    bytes.forEach(
        byte => {

            binary +=
                String.fromCharCode(byte);

        }
    );

    return btoa(binary);
}


/* =========================================================
   BASE64 DECODE
   ========================================================= */

function decodeBase64Unicode(base64) {

    base64 =
        base64.replace(/\s/g, "");


    const binary =
        atob(base64);


    const bytes =
        Uint8Array.from(
            binary,
            char =>
                char.charCodeAt(0)
        );


    return new TextDecoder()
        .decode(bytes);
}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message) {

    document.getElementById("status")
        .textContent = message;

}


/* =========================================================
   START
   ========================================================= */

loadAccounts();

</script>

</body>
</html>
