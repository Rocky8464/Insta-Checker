<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Account Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
        }

        .token-box {
            margin-bottom: 25px;
            padding: 18px;
            background: #f7f7f7;
            border-radius: 10px;
        }

        .token-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #555;
        }

        .token-row {
            display: flex;
            gap: 10px;
        }

        .token-row input {
            flex: 1;
        }

        button {
            height: 38px;
            min-width: 100px;
            padding: 0 16px;
            border: none;
            border-radius: 7px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-sizing: border-box;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .primary-btn {
            background: #222;
            color: white;
        }

        .primary-btn:hover:not(:disabled) {
            background: #000;
        }

        .remove-btn {
            background: #e8e8e8;
            color: #222;
        }

        .remove-btn:hover {
            background: #d8d8d8;
        }

        .change-token {
            display: none;
            margin-top: 8px;
            background: transparent;
            color: #555;
            border: 1px solid #ccc;
        }

        .change-token:hover {
            background: #f2f2f2;
        }

        .add-section {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .add-section input {
            flex: 1;
        }

        .account-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .account {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            background: #f7f7f7;
            border-radius: 8px;
        }

        .account-name {
            font-size: 15px;
            font-weight: 500;
        }

        .save-section {
            margin-top: 25px;
        }

        #saveButton {
            width: 100%;
            height: 44px;
            transition: 0.2s;
        }

        #saveButton.unsaved {
            background: #111;
            box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.12);
        }

        #status {
            min-height: 24px;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            gap: 7px;
        }

        .status-success {
            color: #16833b;
        }

        .status-error {
            color: #c62828;
        }

        .status-unsaved {
            color: #b36b00;
        }

        .status-saving {
            color: #555;
        }

        .success-icon {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #16833b;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #ccc;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 500px) {
            body {
                padding: 20px 10px;
            }

            .container {
                padding: 20px;
            }

            .add-section {
                flex-direction: column;
            }

            .add-section button {
                width: 100%;
            }

            .token-row {
                flex-direction: column;
            }

            .token-row button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Instagram Accounts</h1>

    <!-- Token Section -->
    <div id="tokenBox" class="token-box">
        <label for="tokenInput">GitHub Token</label>

        <div class="token-row">
            <input
                type="password"
                id="tokenInput"
                placeholder="Enter your GitHub token"
            >

            <button
                class="primary-btn"
                onclick="saveToken()"
            >
                Save Token
            </button>
        </div>
    </div>

    <button
        id="changeToken"
        class="change-token"
        onclick="changeToken()"
    >
        Change Token
    </button>

    <!-- Add Account -->
    <div class="add-section">
        <input
            type="text"
            id="accountInput"
            placeholder="Instagram username"
            onkeydown="handleEnter(event)"
        >

        <button
            class="primary-btn"
            onclick="addAccount()"
        >
            Add Account
        </button>
    </div>

    <!-- Account List -->
    <div id="accountList" class="account-list"></div>

    <!-- Save -->
    <div class="save-section">
        <button
            id="saveButton"
            class="primary-btn"
            onclick="saveAccounts()"
            disabled
        >
            Save Changes
        </button>

        <div id="status"></div>
    </div>

</div>

<script>

    // ==============================
    // GitHub Configuration
    // ==============================

    const GITHUB_USERNAME = "Rocky8464";
    const REPOSITORY = "Insta-Checker";
    const BRANCH = "main";
    const FILE_PATH = "accounts.json";

    const API_URL =
        `https://api.github.com/repos/${GITHUB_USERNAME}/${REPOSITORY}/contents/${FILE_PATH}`;


    // ==============================
    // Variables
    // ==============================

    let accounts = [];
    let currentFileSha = null;
    let hasUnsavedChanges = false;
    let isSaving = false;


    // ==============================
    // Token Functions
    // ==============================

    function getToken() {
        return localStorage.getItem("github_token");
    }


    function saveToken() {

        const input = document.getElementById("tokenInput");
        const token = input.value.trim();

        if (!token) {
            showStatus("Please enter a GitHub token.", "error");
            return;
        }

        localStorage.setItem("github_token", token);

        input.value = "";

        updateTokenUI();

        loadAccounts();
    }


    function changeToken() {

        localStorage.removeItem("github_token");

        document.getElementById("tokenBox").style.display = "block";
        document.getElementById("changeToken").style.display = "none";

        showStatus("", "");

    }


    function updateTokenUI() {

        const token = getToken();

        const tokenBox = document.getElementById("tokenBox");
        const changeTokenButton = document.getElementById("changeToken");

        if (token) {
            tokenBox.style.display = "none";
            changeTokenButton.style.display = "block";
        } else {
            tokenBox.style.display = "block";
            changeTokenButton.style.display = "none";
        }
    }


    // ==============================
    // Load Accounts
    // ==============================

    async function loadAccounts() {

        const token = getToken();

        if (!token) {
            showStatus("Enter your GitHub token first.", "error");
            return;
        }

        try {

            showStatus("Loading accounts...", "saving");

            const response = await fetch(
                `${API_URL}?ref=${BRANCH}`,
                {
                    method: "GET",
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Accept": "application/vnd.github+json"
                    }
                }
            );

            if (!response.ok) {

                const errorText = await response.text();

                throw new Error(
                    `GitHub error ${response.status}: ${errorText}`
                );
            }

            const data = await response.json();

            currentFileSha = data.sha;

            const decoded = decodeURIComponent(
                escape(
                    atob(data.content.replace(/\n/g, ""))
                )
            );

            accounts = JSON.parse(decoded);

            if (!Array.isArray(accounts)) {
                accounts = [];
            }

            hasUnsavedChanges = false;

            displayAccounts();

            updateSaveButton();

            showStatus(
                "Accounts loaded successfully.",
                "success"
            );

        } catch (error) {

            console.error(error);

            showStatus(
                error.message,
                "error"
            );
        }
    }


    // ==============================
    // Display Accounts
    // ==============================

    function displayAccounts() {

        const list = document.getElementById("accountList");

        list.innerHTML = "";

        accounts.forEach((account, index) => {

            const row = document.createElement("div");

            row.className = "account";

            row.innerHTML = `
                <span class="account-name">@${escapeHtml(account)}</span>

                <button
                    class="remove-btn"
                    onclick="removeAccount(${index})"
                >
                    Remove
                </button>
            `;

            list.appendChild(row);
        });
    }


    // ==============================
    // Add Account
    // ==============================

    function addAccount() {

        const input = document.getElementById("accountInput");

        let username = input.value.trim();

        username = username.replace(/^@/, "");

        if (!username) {
            return;
        }

        if (accounts.includes(username)) {

            showStatus(
                "Account already exists.",
                "error"
            );

            return;
        }

        accounts.push(username);

        input.value = "";

        hasUnsavedChanges = true;

        displayAccounts();

        updateSaveButton();

        showStatus(
            "Unsaved changes",
            "unsaved"
        );
    }


    function handleEnter(event) {

        if (event.key === "Enter") {
            addAccount();
        }
    }


    // ==============================
    // Remove Account
    // ==============================

    function removeAccount(index) {

        accounts.splice(index, 1);

        hasUnsavedChanges = true;

        displayAccounts();

        updateSaveButton();

        showStatus(
            "Unsaved changes",
            "unsaved"
        );
    }


    // ==============================
    // Save Button UI
    // ==============================

    function updateSaveButton() {

        const button = document.getElementById("saveButton");

        if (hasUnsavedChanges && !isSaving) {

            button.disabled = false;
            button.classList.add("unsaved");

        } else {

            button.disabled = true;
            button.classList.remove("unsaved");
        }
    }


    // ==============================
    // Get Latest File
    // ==============================

    async function getLatestFile(token) {

        const response = await fetch(
            `${API_URL}?ref=${BRANCH}&_=${Date.now()}`,
            {
                method: "GET",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Accept": "application/vnd.github+json"
                }
            }
        );

        if (!response.ok) {

            const errorText = await response.text();

            throw new Error(
                `GitHub error ${response.status}: ${errorText}`
            );
        }

        return await response.json();
    }


    // ==============================
    // Save Accounts
    // ==============================

    async function saveAccounts() {

        if (!hasUnsavedChanges || isSaving) {
            return;
        }

        const token = getToken();

        if (!token) {

            showStatus(
                "GitHub token is missing.",
                "error"
            );

            return;
        }

        try {

            isSaving = true;

            updateSaveButton();

            showStatus(
                "Saving changes...",
                "saving"
            );

            // Get latest SHA before writing
            const latestFile = await getLatestFile(token);

            currentFileSha = latestFile.sha;

            const content = JSON.stringify(
                accounts,
                null,
                2
            );

            const encodedContent = btoa(
                unescape(
                    encodeURIComponent(content)
                )
            );

            const response = await fetch(
                API_URL,
                {
                    method: "PUT",

                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Accept": "application/vnd.github+json",
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        message: "Update Instagram accounts",
                        content: encodedContent,
                        sha: currentFileSha,
                        branch: BRANCH
                    })
                }
            );


            if (!response.ok) {

                const errorText = await response.text();

                throw new Error(
                    `GitHub error ${response.status}: ${errorText}`
                );
            }


            const data = await response.json();

            currentFileSha = data.content.sha;

            hasUnsavedChanges = false;

            showStatus(
                `<span class="success-icon">✓</span> Changes saved successfully.`,
                "success"
            );

        } catch (error) {

            console.error(error);

            showStatus(
                error.message,
                "error"
            );

        } finally {

            isSaving = false;

            updateSaveButton();
        }
    }


    // ==============================
    // Status
    // ==============================

    function showStatus(message, type) {

        const status = document.getElementById("status");

        status.className = "";

        if (!message) {
            status.innerHTML = "";
            return;
        }

        if (type === "saving") {

            status.classList.add("status-saving");

            status.innerHTML = `
                <span class="spinner"></span>
                ${message}
            `;

        } else {

            status.classList.add(
                type === "success"
                    ? "status-success"
                    : type === "error"
                        ? "status-error"
                        : "status-unsaved"
            );

            status.innerHTML = message;
        }
    }


    // ==============================
    // HTML Escape
    // ==============================

    function escapeHtml(value) {

        return value
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ==============================
    // Startup
    // ==============================

    updateTokenUI();

    if (getToken()) {
        loadAccounts();
    }

</script>

</body>
</html>
