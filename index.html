<body>

<div class="container">

    <div class="header">

        <h1>Instagram Reel Monitor</h1>

        <p>Manage the Instagram accounts you want to monitor.</p>

    </div>


    <!-- TOKEN SETUP -->

    <div id="tokenBox" class="card token-box">

        <h3>GitHub Connection</h3>

        <p>
            Enter your GitHub token to manage the account list.
        </p>

        <input
            type="password"
            id="token"
            class="token-input"
            placeholder="GitHub token"
        >

        <button
            class="token-button"
            onclick="saveToken()"
        >
            Connect
        </button>

    </div>


    <!-- CHANGE TOKEN -->

    <button
        id="changeToken"
        class="change-token"
        onclick="changeToken()"
    >
        ⚙ Change GitHub Token
    </button>


    <!-- ACCOUNTS -->

    <div class="card">

        <h2>Monitored Accounts</h2>

        <div id="accounts">
            Loading...
        </div>


        <div class="input-row">

            <input
                type="text"
                id="username"
                placeholder="Instagram username"
            >

            <button
                class="add-button"
                onclick="addAccount()"
            >
                Add
            </button>

        </div>


        <button
            class="save-button"
            onclick="saveAccounts()"
        >
            Save Changes
        </button>


        <div id="status"></div>

    </div>

</div>


<script>

/* =========================================================
   GITHUB SETTINGS
   ========================================================= */

const GITHUB_USERNAME = "Rocky8464";

const REPOSITORY = "Insta-Checker";

const BRANCH = "main";

const FILE_PATH = "accounts.json";


/* =========================================================
   VARIABLES
   ========================================================= */

let accounts = [];

let currentFileSha = null;


/* =========================================================
   GITHUB API
   ========================================================= */

const API_URL =
    `https://api.github.com/repos/${GITHUB_USERNAME}/${REPOSITORY}/contents/${FILE_PATH}`;


/* =========================================================
   TOKEN
   ========================================================= */

function getToken() {

    return localStorage.getItem("github_token");

}


function saveToken() {

    const input =
        document.getElementById("token");

    const token =
        input.value.trim();


    if (!token) {

        alert("Enter a GitHub token.");

        return;
    }


    localStorage.setItem(
        "github_token",
        token
    );


    input.value = "";

    updateTokenUI();

    loadAccounts();

}


function changeToken() {

    localStorage.removeItem(
        "github_token"
    );

    currentFileSha = null;

    updateTokenUI();

    document.getElementById("accounts").innerHTML =
        "<p class='empty'>Enter a GitHub token to continue.</p>";

    setStatus("");

}


function updateTokenUI() {

    const tokenBox =
        document.getElementById("tokenBox");

    const changeTokenButton =
        document.getElementById("changeToken");

    const token =
        getToken();


    if (token) {

        tokenBox.style.display = "none";

        changeTokenButton.style.display = "inline-block";

    } else {

        tokenBox.style.display = "block";

        changeTokenButton.style.display = "none";

    }

}


/* =========================================================
   LOAD ACCOUNTS
   ========================================================= */

async function loadAccounts() {

    const token =
        getToken();


    if (!token) {

        document.getElementById("accounts").innerHTML =
            "<p class='empty'>Connect GitHub to load accounts.</p>";

        return;
    }


    setStatus("Loading accounts...");


    try {

        const response =
            await fetch(
                `${API_URL}?ref=${BRANCH}&_=${Date.now()}`,
                {
                    method: "GET",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`,

                        "Accept":
                            "application/vnd.github+json"
                    },

                    cache: "no-store"
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                `GitHub error ${response.status}: ${errorText}`
            );
        }


        const data =
            await response.json();


        const decoded =
            decodeBase64Unicode(
                data.content
            );


        accounts =
            JSON.parse(decoded);


        currentFileSha =
            data.sha;


        displayAccounts();

        setStatus(
            "✓ Connected to GitHub"
        );

        document.getElementById("status")
            .className = "connected";


    } catch (error) {

        console.error(error);

        setStatus(
            "❌ " + error.message
        );

        document.getElementById("status")
            .className = "";

    }

}


/* =========================================================
   DISPLAY ACCOUNTS
   ========================================================= */

function displayAccounts() {

    const container =
        document.getElementById("accounts");

    container.innerHTML = "";


    if (accounts.length === 0) {

        container.innerHTML =
            "<p class='empty'>No accounts added.</p>";

        return;
    }


    accounts.forEach(
        (username, index) => {

            const row =
                document.createElement("div");

            row.className =
                "account";


            const name =
                document.createElement("div");

            name.className =
                "account-name";

            name.textContent =
                "@" + username;


            const removeButton =
                document.createElement("button");

            removeButton.className =
                "remove-button";

            removeButton.textContent =
                "Remove";


            removeButton.onclick =
                function () {

                    removeAccount(index);

                };


            row.appendChild(name);

            row.appendChild(removeButton);

            container.appendChild(row);

        }
    );

}


/* =========================================================
   ADD ACCOUNT
   ========================================================= */

function addAccount() {

    const input =
        document.getElementById("username");

    let username =
        input.value.trim();


    if (!username) {

        alert(
            "Enter an Instagram username."
        );

        return;
    }


    username =
        username.replace(/^@/, "");


    if (accounts.includes(username)) {

        alert(
            "Account already exists."
        );

        return;
    }


    accounts.push(username);

    input.value = "";

    displayAccounts();

    setStatus(
        "Account added. Click Save Changes."
    );

    document.getElementById("status")
        .className = "";

}


/* =========================================================
   REMOVE ACCOUNT
   ========================================================= */

function removeAccount(index) {

    const username =
        accounts[index];


    if (!confirm(
        `Remove @${username}?`
    )) {

        return;
    }


    accounts.splice(index, 1);

    displayAccounts();

    setStatus(
        "Account removed. Click Save Changes."
    );

    document.getElementById("status")
        .className = "";

}


/* =========================================================
   GET LATEST FILE
   ========================================================= */

async function getLatestFile() {

    const token =
        getToken();


    const response =
        await fetch(
            `${API_URL}?ref=${BRANCH}&_=${Date.now()}`,
            {
                method: "GET",

                headers: {
                    "Authorization":
                        `Bearer ${token}`,

                    "Accept":
                        "application/vnd.github+json"
                },

                cache: "no-store"
            }
        );


    if (!response.ok) {

        const errorText =
            await response.text();

        throw new Error(
            `Could not get latest file: ${response.status} ${errorText}`
        );
    }


    return await response.json();

}


/* =========================================================
   SAVE ACCOUNTS
   ========================================================= */

async function saveAccounts() {

    const token =
        getToken();


    if (!token) {

        alert(
            "GitHub token is missing."
        );

        return;
    }


    setStatus(
        "Saving to GitHub..."
    );


    try {

        /*
           Get latest SHA before writing.
        */

        const latestFile =
            await getLatestFile();


        currentFileSha =
            latestFile.sha;


        const jsonContent =
            JSON.stringify(
                accounts,
                null,
                2
            ) + "\n";


        const encodedContent =
            encodeBase64Unicode(
                jsonContent
            );


        const response =
            await fetch(
                API_URL,
                {
                    method: "PUT",

                    headers: {
                        "Authorization":
                            `Bearer ${token}`,

                        "Accept":
                            "application/vnd.github+json",

                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            "Update monitored Instagram accounts",

                        content:
                            encodedContent,

                        sha:
                            currentFileSha,

                        branch:
                            BRANCH

                    })
                }
            );


        if (!response.ok) {

            const errorText =
                await response.text();

            throw new Error(
                `GitHub error ${response.status}: ${errorText}`
            );
        }


        const data =
            await response.json();


        currentFileSha =
            data.content.sha;


        setStatus(
            "✓ Changes saved successfully."
        );

        document.getElementById("status")
            .className = "connected";


    } catch (error) {

        console.error(error);

        setStatus(
            "❌ " + error.message
        );

        document.getElementById("status")
            .className = "";

    }

}


/* =========================================================
   BASE64 ENCODE
   ========================================================= */

function encodeBase64Unicode(text) {

    const bytes =
        new TextEncoder().encode(text);

    let binary = "";


    bytes.forEach(
        byte => {

            binary +=
                String.fromCharCode(byte);

        }
    );


    return btoa(binary);

}


/* =========================================================
   BASE64 DECODE
   ========================================================= */

function decodeBase64Unicode(base64) {

    base64 =
        base64.replace(/\s/g, "");


    const binary =
        atob(base64);


    const bytes =
        Uint8Array.from(
            binary,
            char =>
                char.charCodeAt(0)
        );


    return new TextDecoder()
        .decode(bytes);

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message) {

    document.getElementById("status")
        .textContent = message;

}


/* =========================================================
   START
   ========================================================= */

updateTokenUI();

loadAccounts();

</script>

</body>
</html>
